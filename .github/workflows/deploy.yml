name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # Profile data lives in Supabase: check hourly and rebuild only if it changed.
  schedule:
    - cron: '0 21 * * *' # 21:00 UTC = 21:00 Paris time

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

# Public, read-only values (RLS allows SELECT only; private data is not exposed to this key).
env:
  SUPABASE_URL: https://koavciwcxlezwikbbyks.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_OpTriJ85zlFJ_j8P2jSCeQ_eNNNnzW9
  SITE_URL: https://tanguyhardion.github.io

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - id: cmp
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          remote=$(curl -fsS "$SUPABASE_URL/rest/v1/profile_meta?select=updated_at" -H "apikey: $SUPABASE_ANON_KEY" | jq -r '.[0].updated_at')
          deployed=$(curl -fsS "$SITE_URL/profile-version.json" | jq -r '.updatedAt' || echo none)
          echo "remote=$remote deployed=$deployed"
          if [ "$(date -d "$remote" +%s%N)" = "$(date -d "$deployed" +%s%N 2>/dev/null)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build with Nuxt (fetches profile from Supabase first)
        run: npm run generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4